name: Bug report
description: Report a reproducible AIQ defect
title: "bug: "
body:
  - type: markdown
    attributes:
      value: |
        Do not include prompts, journals, credentials, personal paths, or other
        sensitive data. Report vulnerabilities through the private security
        link instead.
  - type: input
    id: version
    attributes:
      label: AIQ version
      description: Output from `aiq --version`, or the commit hash.
      placeholder: 0.1.0a1
    validations:
      required: true
  - type: dropdown
    id: installation
    attributes:
      label: Installation method
      options:
        - pipx from a local clone
        - pipx from GitHub
        - editable source checkout
        - other
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Environment
      description: Operating system and Python and SQLite versions.
      placeholder: Arch Linux; Python 3.14; SQLite 3.53
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Minimal reproduction
      description: Provide exact, redacted commands and inputs.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
      description: Include redacted output and exit status when relevant.
    validations:
      required: true
  - type: checkboxes
    id: privacy
    attributes:
      label: Privacy check
      options:
        - label: I removed private message content, credentials, and personal data.
          required: true
