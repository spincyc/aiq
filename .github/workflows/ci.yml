name: CI

on:
  pull_request:
  push:
    branches:
      - main
    tags:
      # Release tags run the same matrix as main, so a cut is verified on
      # every supported OS and Python rather than on one local `make ci`.
      - "v*"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  PIP_DISABLE_PIP_VERSION_CHECK: "1"
  PYTHONDONTWRITEBYTECODE: "1"
  PYTHONUTF8: "1"

jobs:
  test:
    name: ${{ matrix.os }} / Python ${{ matrix.python }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            python: "3.11"
            policy: false
          - os: ubuntu-24.04
            python: "3.12"
            policy: false
          - os: ubuntu-24.04
            python: "3.13"
            policy: false
          - os: ubuntu-24.04
            python: "3.14"
            policy: true
          - os: macos-15-intel
            python: "3.11"
            policy: false
          - os: macos-15
            python: "3.14"
            policy: true

    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: ${{ matrix.policy && '0' || '1' }}

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python }}

      - name: Check the release tag against the source
        if: ${{ startsWith(github.ref, 'refs/tags/v') }}
        shell: bash
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: make release-check TAG="$RELEASE_TAG"

      - name: Install package
        run: |
          python -m pip install build "setuptools>=77.0.3"
          python -m pip install --no-deps .

      - name: Smoke-test installed CLI
        shell: bash
        run: |
          smoke_directory=$(mktemp -d)
          trap 'rm -rf -- "$smoke_directory"' EXIT
          cd "$smoke_directory"
          aiq --version
          aiq capability list --json |
            python -c 'import json,sys; assert json.load(sys.stdin)["capabilities"]'

      - name: Test installed package
        if: ${{ !matrix.policy }}
        run: |
          python - <<'PY'
          import sqlite3

          if sqlite3.sqlite_version_info < (3, 37, 0):
              raise SystemExit(
                  f"SQLite 3.37+ is required; found {sqlite3.sqlite_version}"
              )
          connection = sqlite3.connect(":memory:")
          try:
              connection.execute("CREATE TABLE capability(value TEXT) STRICT")
              result = connection.execute(
                  """SELECT json_valid('[]'), json_type('[]'),
                            json_extract('{"v":1}', '$.v')"""
              ).fetchone()
          finally:
              connection.close()
          if result != (1, "array", 1):
              raise SystemExit("SQLite JSON functions are unavailable")
          PY
          python -I -m unittest discover -s tests

      - name: Install policy-check tools
        if: ${{ matrix.policy }}
        shell: bash
        env:
          # Bump the version and every per-asset checksum together from
          # https://github.com/gitleaks/gitleaks/releases
          # (values in gitleaks_${VERSION}_checksums.txt).
          GITLEAKS_VERSION: "8.30.1"
          GITLEAKS_SHA256_LINUX_X64: "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb"
          GITLEAKS_SHA256_DARWIN_ARM64: "b40ab0ae55c505963e365f271a8d3846efbc170aa17f2607f13df610a9aeb6a5"
        run: |
          set -euo pipefail
          tool_dir=$RUNNER_TEMP/aiq-tools
          mkdir -p "$tool_dir"
          case "$(uname -s)-$(uname -m)" in
            Linux-x86_64) asset="linux_x64"; sha=$GITLEAKS_SHA256_LINUX_X64 ;;
            Darwin-arm64) asset="darwin_arm64"; sha=$GITLEAKS_SHA256_DARWIN_ARM64 ;;
            *) echo "no pinned gitleaks asset for $(uname -s)-$(uname -m)" >&2; exit 1 ;;
          esac
          archive="gitleaks_${GITLEAKS_VERSION}_${asset}.tar.gz"
          curl --fail --location --silent --show-error \
            --output "$RUNNER_TEMP/$archive" \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/${archive}"
          # Verify the digest explicitly (fail-closed). GNU `sha256sum --check`
          # is not portable: macOS ships a BSD sha256sum that rejects it, so
          # compute the digest with shasum (present on macOS and Linux runners)
          # and compare. Fall back to sha256sum where shasum is absent.
          if command -v shasum >/dev/null 2>&1; then
            actual=$(shasum -a 256 "$RUNNER_TEMP/$archive" | cut -d' ' -f1)
          else
            actual=$(sha256sum "$RUNNER_TEMP/$archive" | cut -d' ' -f1)
          fi
          if [ "$actual" != "$sha" ]; then
            echo "gitleaks $asset checksum mismatch: expected $sha, got $actual" >&2
            exit 1
          fi
          tar -C "$tool_dir" -xzf "$RUNNER_TEMP/$archive" gitleaks
          echo "$tool_dir" >> "$GITHUB_PATH"
          "$tool_dir/gitleaks" version
          python -m pip install pipx

      - name: Run full verification
        if: ${{ matrix.policy }}
        run: make ci
