name: CI

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  PIP_DISABLE_PIP_VERSION_CHECK: "1"
  PYTHONDONTWRITEBYTECODE: "1"
  PYTHONUTF8: "1"

jobs:
  test:
    name: ${{ matrix.os }} / Python ${{ matrix.python }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            python: "3.11"
            policy: false
          - os: ubuntu-24.04
            python: "3.12"
            policy: false
          - os: ubuntu-24.04
            python: "3.13"
            policy: false
          - os: ubuntu-24.04
            python: "3.14"
            policy: true
          - os: macos-15-intel
            python: "3.11"
            policy: false
          - os: macos-15
            python: "3.14"
            policy: false

    steps:
      - name: Check out source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: ${{ matrix.policy && '0' || '1' }}

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: ${{ matrix.python }}

      - name: Install package
        run: |
          python -m pip install build "setuptools>=77.0.3"
          python -m pip install --no-deps .

      - name: Smoke-test installed CLI
        shell: bash
        run: |
          smoke_directory=$(mktemp -d)
          trap 'rm -rf -- "$smoke_directory"' EXIT
          cd "$smoke_directory"
          aiq --version
          aiq capability list --json |
            python -c 'import json,sys; assert json.load(sys.stdin)["capabilities"]'

      - name: Test installed package
        if: ${{ !matrix.policy }}
        run: |
          python - <<'PY'
          import sqlite3

          if sqlite3.sqlite_version_info < (3, 37, 0):
              raise SystemExit(
                  f"SQLite 3.37+ is required; found {sqlite3.sqlite_version}"
              )
          connection = sqlite3.connect(":memory:")
          try:
              connection.execute("CREATE TABLE capability(value TEXT) STRICT")
              result = connection.execute(
                  """SELECT json_valid('[]'), json_type('[]'),
                            json_extract('{"v":1}', '$.v')"""
              ).fetchone()
          finally:
              connection.close()
          if result != (1, "array", 1):
              raise SystemExit("SQLite JSON functions are unavailable")
          PY
          python -I -m unittest discover -s tests

      - name: Install policy-check tools
        if: ${{ matrix.policy }}
        shell: bash
        run: |
          echo /home/linuxbrew/.linuxbrew/bin >> "$GITHUB_PATH"
          /home/linuxbrew/.linuxbrew/bin/brew install gitleaks
          python -m pip install pipx

      - name: Verify and build distributions
        if: ${{ matrix.policy }}
        run: |
          make public-audit
          make verify
          make build

      - name: Test source installation
        if: ${{ matrix.policy }}
        run: ./tools/acceptance-install
